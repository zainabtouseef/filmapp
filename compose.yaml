name: cineconnect

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cineconnect
      MYSQL_USER: cineconnect
      MYSQL_PASSWORD: local-only-password
      MYSQL_ROOT_PASSWORD: local-root-only-password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin=mysql-bin
      - --binlog-expire-logs-seconds=604800
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: replace-local-minio-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 4
      --timeout 60 --access-logfile - app.wsgi:app
    ports:
      - "127.0.0.1:5000:8000"
    volumes:
      - ./backend/.storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    command: celery -A app.celery_app:celery worker --loglevel=INFO --concurrency=2
    volumes:
      - ./backend/.storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    command: celery -A app.celery_app:celery beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  minio_data:
