server {
    listen 80;
    listen [::]:80;
    server_name cine.nalexustechnologies.com;

    root /var/www/cineconnect/bootstrap;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        default_type application/json;
        return 200 '{"status":"provisioning","service":"cineconnect"}';
    }
}
