openapi: 3.1.0
info:
  title: CineConnect API
  version: 1.0.0
  description: |
    Source-first contract for CineConnect. Paths are added by vertical slice and
    must pass backend response-contract tests before they are marked complete.
servers:
  - url: https://cine.nalexustechnologies.com/api/v1
    description: Production
  - url: http://127.0.0.1:5000/api/v1
    description: Local development
tags:
  - name: Health
  - name: App
  - name: Authentication
  - name: Roles
  - name: Files
  - name: KYC
  - name: Admin Verification
  - name: Profiles
  - name: Marketplace
  - name: Projects
  - name: Director
  - name: Bookings
  - name: Contracts
  - name: Legal
  - name: Finance
  - name: Operations
  - name: Safety
  - name: Conversations
  - name: Agency
  - name: Brand
  - name: Model
  - name: Distribution
  - name: Reviews
  - name: Moderation
  - name: Disputes
  - name: Support
  - name: Announcements
  - name: Analytics
  - name: Insurance
  - name: CinePlanner
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /director/dashboard:
    get:
      tags: [Director]
      operationId: getDirectorDashboard
      summary: Director/Producer dashboard aggregate
      responses:
        "200":
          description: Database-backed dashboard summary for the authenticated Director/Producer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorDashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /director/schedule:
    get:
      tags: [Director]
      operationId: getDirectorSchedule
      summary: Director/Producer schedule aggregate
      parameters:
        - in: query
          name: project_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Database-backed production schedule, risk watch, and call-sheet summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorScheduleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /director/discovery:
    get:
      tags: [Director]
      operationId: getDirectorDiscovery
      summary: Director/Producer provider-specific discovery feed
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Database-backed discovery cards for non-talent provider records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorDiscoveryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /director/discovery/{kind}/{public_id}:
    get:
      tags: [Director]
      operationId: getDirectorDiscoveryItem
      summary: Director/Producer provider-specific discovery detail
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [actor, model, location, equipment, agency, distribution]
        - in: path
          name: public_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rich detail DTO for a provider-specific Director discovery record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorDiscoveryItemEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /app/bootstrap:
    get:
      tags: [App]
      operationId: getAppBootstrap
      security: []
      parameters:
        - in: header
          name: X-App-Platform
          schema:
            type: string
            enum: [android, ios, web, admin_web]
        - in: header
          name: X-App-Version
          schema:
            type: string
      responses:
        "200":
          description: Public startup configuration and version policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapEnvelope"
  /app/public-config:
    get:
      tags: [App]
      operationId: getPublicConfig
      security: []
      responses:
        "200":
          description: Public product configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigEnvelope"
  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      security: []
      responses:
        "200":
          description: Active product roles in deterministic display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListEnvelope"
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification may still be required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated access and refresh tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session revocation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutEnvelope"
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Accepted regardless of whether the identity exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current authenticated user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/roles:
    get:
      tags: [Roles]
      operationId: listMyRoles
      responses:
        "200":
          description: Active roles granted to the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Roles]
      operationId: addMyRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleMutationRequest"
      responses:
        "201":
          description: Role granted or reactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /me/primary-role:
    patch:
      tags: [Roles]
      operationId: setPrimaryRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleMutationRequest"
      responses:
        "200":
          description: Primary role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /uploads/presign:
    post:
      tags: [Files]
      operationId: presignUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPresignRequest"
      responses:
        "201":
          description: Short-lived local-disk upload ticket. Send bytes to the returned PUT URL before completing the upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicketEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /uploads/{upload_session_id}/binary:
    put:
      tags: [Files]
      operationId: uploadBinary
      parameters:
        - in: path
          name: upload_session_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File bytes stored and server-computed size/checksum returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBinaryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Upload session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Upload session expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: File exceeds the session size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
  /uploads/{upload_session_id}/complete:
    post:
      tags: [Files]
      operationId: completeUpload
      parameters:
        - in: path
          name: upload_session_id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Previously stored upload bytes completed and file queued for scan/processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAssetEnvelope"
        "200":
          description: Idempotent completion response for an already completed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAssetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Upload session expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Upload bytes were not sent before completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /files/{file_id}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      parameters:
        - in: path
          name: file_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owner-only file download.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=0
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found for the authenticated owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /kyc/submissions:
    post:
      tags: [KYC]
      operationId: createKycSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmissionCreateRequest"
      responses:
        "201":
          description: Draft KYC submission created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /kyc/submissions/{submission_id}/submit:
    post:
      tags: [KYC]
      operationId: submitKycSubmission
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: KYC submission moved to pending admin review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /kyc/submissions/{submission_id}/resubmit:
    post:
      tags: [KYC]
      operationId: resubmitKycSubmission
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: KYC submission resubmitted after corrections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/kyc:
    get:
      tags: [KYC]
      operationId: listMyKycSubmissions
      responses:
        "200":
          description: Current user's KYC submissions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/kyc/submissions:
    get:
      tags: [Admin Verification]
      operationId: listAdminKycSubmissions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, pending, approved, rejected, needs_resubmission]
            default: pending
      responses:
        "200":
          description: Admin verification queue. Fine-grained admin RBAC is still pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/kyc/submissions/{submission_id}:
    get:
      tags: [Admin Verification]
      operationId: getAdminKycSubmission
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: KYC submission detail for an authorized reviewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/kyc/submissions/{submission_id}/decision:
    post:
      tags: [Admin Verification]
      operationId: decideAdminKycSubmission
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycDecisionRequest"
      responses:
        "200":
          description: Admin decision recorded and verification event written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /cities:
    get:
      tags: [Profiles]
      operationId: listCities
      security: []
      responses:
        "200":
          description: Active supported cities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityListEnvelope"
  /me/profile:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      responses:
        "200":
          description: Current user's base profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profiles]
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: Updated current user's base profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /talent/profile:
    get:
      tags: [Profiles]
      operationId: getTalentProfile
      responses:
        "200":
          description: Current user's actor/talent profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profiles]
      operationId: updateTalentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentProfileUpdateRequest"
      responses:
        "200":
          description: Updated current user's actor/talent profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /portfolio:
    get:
      tags: [Marketplace]
      operationId: listPortfolioItems
      parameters:
        - in: query
          name: profile_type
          schema:
            type: string
            enum: [talent]
      responses:
        "200":
          description: Current user's portfolio items for the selected profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItemListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Marketplace]
      operationId: createPortfolioItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioItemCreateRequest"
      responses:
        "201":
          description: Portfolio item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItemEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /portfolio/{portfolio_id}:
    patch:
      tags: [Marketplace]
      operationId: updatePortfolioItem
      parameters:
        - in: path
          name: portfolio_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioItemUpdateRequest"
      responses:
        "200":
          description: Portfolio item updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItemEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Marketplace]
      operationId: deletePortfolioItem
      parameters:
        - in: path
          name: portfolio_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portfolio item deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /skills:
    get:
      tags: [Projects]
      operationId: listSkills
      parameters:
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Active skill catalog for project requirements and matching.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListEnvelope"
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200":
          description: Projects visible to the current user through active membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Project created with the caller as owner/member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{project_id}:
    get:
      tags: [Projects]
      operationId: getProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail with members and requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
