components:
  parameters:
    SubmissionId:
      in: path
      name: submission_id
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is missing, expired, invalid, or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The caller is authenticated but lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The mutation conflicts with an existing resource or state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: One or more request fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: The caller exceeded the applicable rate limit.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [request_id, pagination]
      properties:
        request_id:
          type: string
          pattern: "^req_[A-Za-z0-9_-]+$"
        pagination:
          oneOf:
            - $ref: "#/components/schemas/Pagination"
            - type: "null"
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total, pages, sort]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        sort:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            request_id:
              type: string
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, service]
          properties:
            status:
              type: string
              enum: [ok]
            service:
              type: string
              const: cineconnect-api
            dependencies:
              type: object
              additionalProperties:
                type: string
        meta:
          $ref: "#/components/schemas/Meta"
    BootstrapEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [maintenance, force_update, supported_roles]
          properties:
            maintenance:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                message:
                  type: [string, "null"]
            force_update:
              type: object
              required: [required]
              properties:
                required:
                  type: boolean
                store_url:
                  type: [string, "null"]
                  format: uri
            supported_roles:
              type: array
              items:
                $ref: "#/components/schemas/Role"
        meta:
          $ref: "#/components/schemas/Meta"
    DirectorDashboardEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [dashboard]
          properties:
            dashboard:
              type: object
              additionalProperties: false
              required:
                - summary
                - projects
                - timeline
                - payments_attention
                - pipeline
                - activity
                - priority_actions
              properties:
                summary:
                  type: object
                  additionalProperties: false
                  required:
                    - active_projects
                    - project_count
                    - committed_budget_minor
                    - paid_minor
                    - pending_payment_minor
                    - secured_bookings
                    - attention_count
                    - currency
                  properties:
                    active_projects:
                      type: integer
                      minimum: 0
                    project_count:
                      type: integer
                      minimum: 0
                    committed_budget_minor:
                      type: integer
                      minimum: 0
                    paid_minor:
                      type: integer
                      minimum: 0
                    pending_payment_minor:
                      type: integer
                      minimum: 0
                    secured_bookings:
                      type: integer
                      minimum: 0
                    attention_count:
                      type: integer
                      minimum: 0
                    currency:
                      type: string
                      pattern: "^[A-Z]{3}$"
                projects:
                  type: array
                  items:
                    $ref: "#/components/schemas/Project"
                timeline:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                payments_attention:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                pipeline:
                  type: array
