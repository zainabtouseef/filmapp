<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CineConnect dark cinematic film-industry marketplace app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cineconnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cineconnect</title>
  <link rel="manifest" href="manifest.json">
  <script src="director_tutorial_bootstrap.js?v=20260809-27"></script>
  <link rel="stylesheet" href="director_tutorial.css?v=20260809-27">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // Flutter's generated service-worker version changes with every build.
    // Reuse it for the app bundle URL so browsers cannot keep running an
    // earlier deployment after the server has been updated.
    const buildVersion = {{flutter_service_worker_version}};
    for (const build of _flutter.buildConfig.builds) {
      if (build.mainJsPath) {
        build.mainJsPath = `${build.mainJsPath}?v=${buildVersion}`;
      }
    }

    _flutter.loader.load({
      serviceWorkerSettings: { serviceWorkerVersion: buildVersion },
    });
  </script>
  <script src="director_tutorial.js?v=20260809-27" defer></script>
</body>
</html>
