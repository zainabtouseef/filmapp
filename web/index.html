<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="CineConnect dark cinematic film-industry marketplace app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cineconnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cineconnect</title>
  <link rel="manifest" href="manifest.json">
  <script src="director_tutorial_bootstrap.js?v=20260809-27"></script>
  <link rel="stylesheet" href="director_tutorial.css?v=20260813-35">
  <style>
    #cc-boot-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: grid;
      place-items: center;
      background: #faf6ee;
      color: #17140f;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .cc-boot-content { text-align: center; }
    .cc-boot-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border: 2px solid rgba(184, 134, 46, 0.24);
      border-top-color: #b8862e;
      border-radius: 50%;
      animation: cc-boot-spin 0.9s linear infinite;
    }
    #cc-boot-message {
      margin: 0;
      color: #6b655a;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    #cc-boot-reload {
      display: none;
      margin: 18px auto 0;
      padding: 10px 18px;
      border: 1px solid #b8862e;
      border-radius: 10px;
      background: #b8862e;
      color: #17140f;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    @keyframes cc-boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="cc-boot-screen" role="status" aria-live="polite">
    <div class="cc-boot-content">
      <div class="cc-boot-mark" aria-hidden="true"></div>
      <p id="cc-boot-message">Loading CineConnect…</p>
      <button id="cc-boot-reload" type="button" onclick="location.reload()">
        Reload portal
      </button>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // Flutter's generated service-worker version changes with every build.
    // Reuse it for the app bundle URL so browsers cannot keep running an
    // earlier deployment after the server has been updated.
    const buildVersion = {{flutter_service_worker_version}};
    // This release suffix intentionally changes when the production shell or
    // cache policy changes. Flutter's bundle filename is stable, so a unique
    // request URL guarantees that an existing browser cannot reuse the prior
    // day's main.dart.js response.
    const releaseVersion = `${buildVersion}-20260910-media-v3`;
    for (const build of _flutter.buildConfig.builds) {
      if (build.mainJsPath) {
        build.mainJsPath = `${build.mainJsPath}?v=${releaseVersion}`;
      }
    }

    const bootScreen = document.getElementById('cc-boot-screen');
    const bootMessage = document.getElementById('cc-boot-message');
    const bootReload = document.getElementById('cc-boot-reload');
    let firstFrameRendered = false;
    let bootObserver;

    const finishBoot = () => {
      if (firstFrameRendered) return;
      firstFrameRendered = true;
      bootObserver?.disconnect();
      bootScreen.remove();
    };

    const showBootFailure = () => {
      if (firstFrameRendered) return;
      if (document.querySelector('flutter-view')) {
        finishBoot();
        return;
      }
      bootMessage.textContent = 'The portal is taking longer than expected.';
      bootReload.style.display = 'block';
    };

    window.addEventListener('flutter-first-frame', finishBoot, { once: true });
    bootObserver = new MutationObserver(() => {
      if (!document.querySelector('flutter-view')) return;
      window.requestAnimationFrame(() => window.requestAnimationFrame(finishBoot));
    });
    bootObserver.observe(document.body, { childList: true, subtree: true });
    window.addEventListener('error', (event) => {
      if (event.target instanceof HTMLScriptElement) showBootFailure();
    }, true);

    // Serve CanvasKit from CineConnect itself. This avoids Safari blank screens
    // when privacy settings or content blockers reject the public CDN.
    Promise.resolve(_flutter.loader.load({
      config: { canvasKitBaseUrl: 'canvaskit/' },
      serviceWorkerSettings: { serviceWorkerVersion: releaseVersion },
    })).catch(showBootFailure);
    window.setTimeout(showBootFailure, 15000);
  </script>
  <script src="director_tutorial.js?v=20260813-35" defer></script>
</body>
</html>
