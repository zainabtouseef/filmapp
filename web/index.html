<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="CineConnect dark cinematic film-industry marketplace app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cineconnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cineconnect</title>
  <link rel="manifest" href="manifest.json">
  <script src="director_tutorial_bootstrap.js?v=20260809-27"></script>
  <link rel="stylesheet" href="director_tutorial.css?v=20260813-35">
  <style>
    #cc-boot-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: grid;
      place-items: center;
      background: #faf6ee;
      color: #17140f;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .cc-boot-content { text-align: center; }
    .cc-boot-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border: 2px solid rgba(184, 134, 46, 0.24);
      border-top-color: #b8862e;
      border-radius: 50%;
      animation: cc-boot-spin 0.9s linear infinite;
    }
    #cc-boot-message {
      margin: 0;
      color: #6b655a;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    #cc-boot-reload {
      display: none;
      margin: 18px auto 0;
      padding: 10px 18px;
      border: 1px solid #b8862e;
      border-radius: 10px;
      background: #b8862e;
      color: #17140f;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    @keyframes cc-boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="cc-boot-screen" role="status" aria-live="polite">
    <div class="cc-boot-content">
      <div class="cc-boot-mark" aria-hidden="true"></div>
      <p id="cc-boot-message">Loading CineConnect…</p>
      <button id="cc-boot-reload" type="button" onclick="location.reload()">
        Reload portal
      </button>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // Flutter no longer generates a service-worker version when PWA caching is
    // disabled, so keep an explicit release ID for the stable bundle filename.
    // Bump this for every production release.
    const releaseVersion = '20260924-fast-start-v13';
    const pageUrl = new URL(window.location.href);
    const recoveryMode =
      pageUrl.searchParams.get('cc-recovery') === releaseVersion;
    const requestVersion = releaseVersion;
    for (const build of _flutter.buildConfig.builds) {
      if (build.mainJsPath) {
        build.mainJsPath = `${build.mainJsPath}?v=${requestVersion}`;
      }
    }

    // dart2js names deferred portal chunks with stable numeric filenames.
    // Attach the release ID so a new deployment can never reuse a chunk from
    // an older app version while returning visits still use their cache.
    self.dartDeferredLibraryMultiLoader = (uris, success, failure) => {
      let pending = uris.length;
      let settled = false;
      if (pending === 0) {
        success();
        return;
      }
      const loaded = () => {
        if (settled) return;
        pending -= 1;
        if (pending === 0) {
          settled = true;
          success();
        }
      };
      const failed = (event) => {
        if (settled) return;
        settled = true;
        const source = event?.target?.src ?? 'a deferred portal chunk';
        failure(new Error(`Could not load ${source}`));
      };
      for (const uri of uris) {
        const chunkUrl = new URL(uri, document.baseURI);
        chunkUrl.searchParams.set('v', requestVersion);
        const script = document.createElement('script');
        script.src = chunkUrl.toString();
        script.onload = loaded;
        script.onerror = failed;
        document.head.appendChild(script);
      }
    };

    const bootScreen = document.getElementById('cc-boot-screen');
    const bootMessage = document.getElementById('cc-boot-message');
    const bootReload = document.getElementById('cc-boot-reload');
    let firstFrameRendered = false;
    let recoveryStarted = false;
    let bootObserver;

    const finishBoot = () => {
      if (firstFrameRendered) return;
      firstFrameRendered = true;
      bootObserver?.disconnect();
      bootScreen.remove();
      if (recoveryMode) {
        const cleanUrl = new URL(window.location.href);
        cleanUrl.searchParams.delete('cc-recovery');
        cleanUrl.searchParams.delete('cc-bust');
        window.history.replaceState(
          null,
          '',
          `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`,
        );
      }
    };

    const showBootFailure = () => {
      if (firstFrameRendered) return;
      if (document.querySelector('flutter-view')) {
        finishBoot();
        return;
      }
      if (!recoveryMode && !recoveryStarted) {
        recoveryStarted = true;
        bootMessage.textContent = 'Optimizing startup for this browser…';
        const recoveryUrl = new URL(window.location.href);
        recoveryUrl.searchParams.set('cc-recovery', releaseVersion);
        recoveryUrl.searchParams.set('cc-bust', Date.now().toString());
        window.location.replace(recoveryUrl.toString());
        return;
      }
      bootMessage.textContent = 'The portal is taking longer than expected.';
      bootReload.style.display = 'block';
    };

    const showSlowBoot = () => {
      if (firstFrameRendered) return;
      if (document.querySelector('flutter-view')) {
        finishBoot();
        return;
      }
      // A slow connection must never restart a partially downloaded bundle.
      bootMessage.textContent = 'Loading CineConnect on this connection…';
    };

    const showManualReload = () => {
      if (firstFrameRendered) return;
      if (document.querySelector('flutter-view')) {
        finishBoot();
        return;
      }
      bootMessage.textContent = 'The portal is still loading.';
      bootReload.style.display = 'block';
    };

    window.addEventListener('flutter-first-frame', finishBoot, { once: true });
    bootObserver = new MutationObserver(() => {
      if (!document.querySelector('flutter-view')) return;
      window.requestAnimationFrame(() => window.requestAnimationFrame(finishBoot));
    });
    bootObserver.observe(document.body, { childList: true, subtree: true });
    window.addEventListener('error', (event) => {
      if (event.target instanceof HTMLScriptElement) showBootFailure();
    }, true);

    const clearLegacyWebCache = async () => {
      const wasControlled =
        'serviceWorker' in navigator && navigator.serviceWorker.controller;
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) =>
            registration.unregister()
          ));
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((name) => caches.delete(name)));
        }
      } catch (error) {
        console.warn('Could not clear a legacy Flutter cache.', error);
      }
      return Boolean(wasControlled);
    };

    const startFlutter = async () => {
      // Clear obsolete workers in the background so Safari's worker APIs can
      // never hold the application entrypoint. If an old worker controls this
      // page, the compatibility reload opens a clean network navigation.
      clearLegacyWebCache().then((wasControlled) => {
        if (wasControlled && !firstFrameRendered) showBootFailure();
      });

      // Use Flutter's edge-cached renderer first so the app server only has to
      // deliver CineConnect code. The one-time compatibility reload uses the
      // bundled renderer when a browser or network cannot reach the CDN.
      await _flutter.loader.load({
        config: recoveryMode ? { canvasKitBaseUrl: 'canvaskit/' } : {},
      });
    };

    Promise.resolve(startFlutter()).catch(showBootFailure);
    window.setTimeout(showSlowBoot, 12000);
    window.setTimeout(showManualReload, 45000);
  </script>
  <script src="director_tutorial.js?v=20260813-35" defer></script>
</body>
</html>
