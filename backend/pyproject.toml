[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cineconnect-api"
version = "0.1.0"
description = "CineConnect Flask API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "celery[redis]>=5.5,<6",
  "cryptography>=48.0.1,<50",
  "email-validator>=2.2,<3",
  "Flask>=3.1,<4",
  "Flask-Cors>=6,<7",
  "Flask-Limiter>=3.12,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "gunicorn>=23,<24",
  "openai>=2,<3",
  "openpyxl>=3.1,<4",
  "PyJWT>=2.10,<3",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "redis>=6,<7",
  "reportlab>=4.4,<5",
  "sentry-sdk[flask]>=2.32,<3",
  "structlog>=25,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
  "types-PyMySQL>=1.1,<2",
  "types-redis>=4.6,<5",
  "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires MySQL and Redis",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/celery_app.py",
  "app/wsgi.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated; long column / enum / server_default
# expressions routinely exceed the line limit and are not hand-maintained.
"migrations/versions/*.py" = ["E501"]
# Standalone scripts bootstrap sys.path before importing app modules, so
# module-level imports legitimately follow executable code (E402/I001).
"scripts/*.py" = ["E402", "I001"]
# Demo seed scripts additionally embed long human-readable demo copy (E501).
"scripts/seed_*.py" = ["E402", "E501", "I001"]
"app/scripts/seed_*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "flask_migrate", "flask_migrate.*"]
ignore_missing_imports = true
