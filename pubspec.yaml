name: cineconnect
description: CineConnect — dark cinematic film-industry marketplace app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  camera: ^0.11.0+2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Drop real portrait photos here (see README). The app runs fine
  # without them — PortraitImage falls back to a cinematic placeholder.
  assets:
    - assets/images/

  # Uncomment after adding the .ttf files under assets/fonts/.
  # For the closest match to the reference, use Playfair Display (serif
  # headings) + Inter (UI). Download from Google Fonts.
  #
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
  #       - asset: assets/fonts/PlayfairDisplay-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
