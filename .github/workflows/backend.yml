name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  push:
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - "compose.yaml"
      - ".github/workflows/backend.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cineconnect
          MYSQL_USER: cineconnect
          MYSQL_PASSWORD: local-only-password
          MYSQL_ROOT_PASSWORD: local-root-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot
          -plocal-root-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://cineconnect:local-only-password@127.0.0.1:3306/cineconnect?charset=utf8mb4
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: mysql+pymysql://cineconnect:local-only-password@127.0.0.1:3306/cineconnect?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      RATELIMIT_STORAGE_URI: memory://
      SECRET_KEY: test-only-secret
      JWT_SECRET_KEY: test-only-jwt-secret
      PAYMENT_MODE: sandbox
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e 'backend[dev]'
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy --config-file backend/pyproject.toml backend/app
      - run: flask --app app.wsgi db upgrade -d migrations
        working-directory: backend
      - name: Run backend tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=0
        working-directory: backend
      - name: Enforce backend coverage threshold
        run: coverage report --fail-under=85
        working-directory: backend
